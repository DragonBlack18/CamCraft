name: CamCraft source recovery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover complete files from verified upload prefix
        shell: python
        run: |
          import base64, hashlib, io, json, lzma, pathlib, subprocess, tarfile
          shas = '''ae6f814a732b43561fc2d81f054e601e240e890c c1ac2839f7a39860877c26b271f28ea279c02572 36a9a2d96f4494ffec51e04e6cb624b497ff48ce adb6a7013e8cebc810130409cb21ad3020c5994c 77449702bb515a23f0db36af9eaa36344ac2b06a f10cec6485250ce6579fb0b2112d62b32261b133 3512663972e00e90285ef43aa67052a96e56da6d c27a784979ed577b5e04e7aaf32861aef4d0ee0f 1cdae5f71bb89739f24513e8f53f00e649ce3de9 5dc63c8b3f0b079b075c24da3fa057a235310245 c2b4a0b21c67556823c6996a66752587da928f26'''.split()
          parts = []
          for index, sha in enumerate(shas):
              part = pathlib.Path(f'.bootstrap/source-{index:02d}.b64').read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              parts.append(part)
          prefix = base64.b64decode(b''.join(parts), validate=True)
          dec = lzma.LZMADecompressor()
          raw = dec.decompress(prefix)
          print(f'Recovered {len(raw)} uncompressed bytes. Archive complete: {dec.eof}')
          root = pathlib.Path.cwd().resolve()
          files = {}
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as tar:
              while True:
                  try:
                      member = tar.next()
                      if member is None:
                          break
                      if member.offset_data + member.size > len(raw):
                          print('Incomplete final entry, not imported:', member.name)
                          break
                      path = pathlib.PurePosixPath(member.name)
                      assert member.isfile() and not path.is_absolute() and '..' not in path.parts and '\\' not in member.name
                      assert path.parts[0] not in ('.git', '.github', '.bootstrap', 'data', 'models')
                      data = tar.extractfile(member).read()
                      assert len(data) == member.size and len(data) < 2000000
                      dest = root.joinpath(*path.parts)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(data)
                      files[member.name] = hashlib.sha256(data).hexdigest()
                      print('Recovered:', member.name)
                  except tarfile.ReadError:
                      break
          pathlib.Path('.bootstrap/recovery.json').write_text(json.dumps({'complete': dec.eof, 'files': files}, indent=2), encoding='utf-8')
          print(f'Recovered {len(files)} complete files. This is source recovery, NOT a release approval.')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','commit','-m','chore: recover complete source files from interrupted transfer'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          subprocess.run(['git','archive','--format=zip','-o','/tmp/CamCraft-recovered-source.zip','HEAD'],check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: CamCraft-recovered-source
          path: /tmp/CamCraft-recovered-source.zip
          if-no-files-found: error
